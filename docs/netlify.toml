# Netlify deployment for the dev-process-manager docs.
#
# Mirrors the Comet DXP docs deployment (vivid-planet/comet -> docs/netlify.toml),
# adapted for this standalone npm package (Comet is a pnpm monorepo).
#
# In the Netlify site settings, set the "Base directory" to `docs` so Netlify reads
# this file and runs the build from the docs/ folder — the same setup Comet uses.

[build]
  command = "npm ci && npm run build"
  publish = "build"
  # Skip the build when nothing in docs/ changed (base directory is docs, so "." is docs/).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
